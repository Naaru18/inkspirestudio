<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Inkspire Studio Register</title>
<link rel="icon" type="image/png" href="../Images/logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="signup.css"> 
</head>
<body>


  <div class="page-controls">
    <button id="themeBtn" class="control-btn">
      <i class="fas fa-moon"></i>
    </button>

    <button id="rtlBtn" class="control-btn">
      RTL
    </button>
  </div>

  <section class="auth-layout">

    
    <div class="auth-left">
      <div class="form-container">

        <a href="index.html" class="logo">
          <i class="fa-solid fa-dragon logo-icon"></i>
          <h2>Inkspire Studio</h2>
        </a>

        <h1>Create Account</h1>
        <p class="subtitle">Join the creative tattoo & piercing community</p>

        <div class="social-login">
          <button><i class="fab fa-google"></i></button>
          <button><i class="fab fa-apple"></i></button>
          <button><i class="fab fa-facebook-f"></i></button>
          <button><i class="fab fa-instagram"></i></button>
        </div>

        <p class="divider-text">Or register with email</p>

        <form>

          <div class="input-group">
            <input type="text" placeholder="Full Name">
            <span><i class="fas fa-user"></i></span>
          </div>

          <div class="input-group">
            <input type="email" placeholder="Email Address">
            <span><i class="fas fa-envelope"></i></span>
          </div>

          <div class="input-group">
            <input type="password" id="password" placeholder="Password">
            <span id="togglePassword">
              <i class="fas fa-eye"></i>
            </span>
          </div>

          <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Confirm Password">
            <span id="toggleConfirmPassword">
              <i class="fas fa-eye"></i>
            </span>
          </div>

          <button class="btn primary auth-btn">Create Account</button>

        </form>

        <p class="bottom-link">
          Already have an account?
          <a href="login.html">Sign In</a>
        </p>

      </div>
    </div>

    
    <div class="auth-right">
      <div class="right-content">
        <h2>Start Your Journey</h2>
        <a href="login.html" class="signup-btn">Sign In</a>
      </div>
    </div>

  </section>
<script>
const body = document.body;
const themeBtn = document.getElementById("themeBtn");
const rtlBtn = document.getElementById("rtlBtn");

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

const togglePassword = document.getElementById("togglePassword");
const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");

const savedTheme = localStorage.getItem("theme");

if (savedTheme === "dark") {
  body.classList.add("dark-mode");
  themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
} else {
  body.classList.remove("dark-mode");
  themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
}

themeBtn.addEventListener("click", () => {
  body.classList.toggle("dark-mode");

  if (body.classList.contains("dark-mode")) {
    localStorage.setItem("theme", "dark");
    themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
  } else {
    localStorage.setItem("theme", "light");
    themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
  }
});

rtlBtn.addEventListener("click", () => {
  document.documentElement.dir =
    document.documentElement.dir === "rtl" ? "ltr" : "rtl";
});

togglePassword.addEventListener("click", () => {
  password.type =
    password.type === "password" ? "text" : "password";

  togglePassword.innerHTML =
    password.type === "password"
      ? '<i class="fas fa-eye"></i>'
      : '<i class="fas fa-eye-slash"></i>';
});
toggleConfirmPassword.addEventListener("click", () => {
  confirmPassword.type =
    confirmPassword.type === "password" ? "text" : "password";

  toggleConfirmPassword.innerHTML =
    confirmPassword.type === "password"
      ? '<i class="fas fa-eye"></i>'
      : '<i class="fas fa-eye-slash"></i>';
});
</script>


</body>
</html>
