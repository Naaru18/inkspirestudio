<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkspire Studio Login</title>
  <link rel="icon" type="image/png" href="../Images/logo.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="login.css">
  
</head>
<body>

  <div class="page-controls">
    <button id="themeBtn" class="control-btn">
      <i class="fas fa-moon"></i>
    </button>

    <button id="rtlBtn" class="control-btn">
      RTL
    </button>
  </div>

  <section class="auth-layout">

    
    <div class="auth-left">
      <div class="form-container">

      <a href="index.html" class="logo">
  <i class="fa-solid fa-dragon logo-icon"></i>
  <h2>Inkspire Studio</h2>
</a>

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue your creative journey</p>

        <div class="social-login">
          <button><i class="fab fa-google"></i></button>
          <button><i class="fab fa-apple"></i></button>
          <button><i class="fab fa-facebook-f"></i></button>
          <button><i class="fab fa-instagram"></i></button>
        </div>

        <p class="divider-text">Or continue with email</p>

        <form>
          <div class="input-group">
            <input type="email" placeholder="Email Address">
            <i class="fas fa-envelope"></i>
          </div>

          <div class="input-group">
            <input type="password" id="password" placeholder="Password">
            <span id="togglePassword">
              <i class="fas fa-eye"></i>
            </span>
          </div>

          <div class="options-row">
            <label class="remember-wrap">
              <input type="checkbox">
              <span>Remember Me</span>
            </label>

            <a href="#">Forgot Password?</a>
          </div>

          <button class="btn primary auth-btn">Sign In</button>
        </form>

      </div>
    </div>

    
    <div class="auth-right">
      <div class="overlay"></div>

      <div class="right-content">
        <h2>Express Yourself</h2>
        <a href="signup.html" class="signup-btn">Create Account</a>
      </div>
    </div>

  </section>

<script>
const body = document.body;
const themeBtn = document.getElementById("themeBtn");
const rtlBtn = document.getElementById("rtlBtn");
const togglePassword = document.getElementById("togglePassword");
const password = document.getElementById("password");


themeBtn.addEventListener("click", () => {
  body.classList.toggle("light");

  themeBtn.innerHTML = body.classList.contains("light")
    ? '<i class="fas fa-sun"></i>'
    : '<i class="fas fa-moon"></i>';
});


rtlBtn.addEventListener("click", () => {
  const html = document.documentElement;

  html.dir = html.dir === "ltr" ? "rtl" : "ltr";
});


togglePassword.addEventListener("click", () => {
  password.type =
    password.type === "password" ? "text" : "password";

  togglePassword.innerHTML =
    password.type === "password"
      ? '<i class="fas fa-eye"></i>'
      : '<i class="fas fa-eye-slash"></i>';
});
</script>


</body>
</html>
